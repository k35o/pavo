# Pavo's entry point. Target repos call this reusable workflow, so the job-level
# boilerplate (concurrency, fork skip, timeout, permissions, App token minting)
# lives here once instead of in N copied workflows.
#
# Caller example:
#   jobs:
#     pavo:
#       if: ${{ github.event_name != 'issue_comment' || startsWith(github.event.comment.body, '/pavo') }}
#       uses: k35o/pavo/.github/workflows/review.yml@main
#       with:
#         instructions: default,nextjs
#       secrets:
#         K35O_BOT_CLIENT_ID: ${{ secrets.K35O_BOT_CLIENT_ID }}
#         K35O_BOT_PRIVATE_KEY: ${{ secrets.K35O_BOT_PRIVATE_KEY }}
#         CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
#
# Expects org/repo secrets: K35O_BOT_CLIENT_ID, K35O_BOT_PRIVATE_KEY,
# CLAUDE_CODE_OAUTH_TOKEN. Passing them explicitly (as above) keeps the rest
# of the caller's secrets out of this workflow; `secrets: inherit` also works.
name: Pavo Review

on:
  workflow_call:
    inputs:
      instructions:
        type: string
        default: 'default'
      extra_prompt:
        type: string
        default: ''
      skip_label:
        type: string
        default: 'pavo:skip'
      model:
        type: string
        default: 'sonnet'
      language:
        type: string
        default: 'auto'
      # Booleans are typed as boolean so callers can write natural YAML
      # (approve: false). They stringify to 'true'/'false' when passed through
      # env, which parseBool in scripts/lib/config.ts consumes.
      approve:
        type: boolean
        default: true
      min_severity:
        type: string
        default: 'suggestion'
      ignore_paths:
        type: string
        default: ''
      allow_bots:
        type: string
        default: ''
      review_drafts:
        type: boolean
        default: false
    secrets:
      K35O_BOT_CLIENT_ID:
        required: true
      K35O_BOT_PRIVATE_KEY:
        required: true
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  pavo:
    # Cross-repository (true fork) PRs cannot see secrets, so the App token
    # step would fail anyway. head.repo.fork is NOT this check: it is true for
    # every in-repo PR on a repository that is itself a fork.
    if: ${{ github.event.pull_request == null || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only checkout needs the workflow token; every GitHub write (review,
    # reply, dismiss, resolve) goes through the App installation token. Keeping
    # this at contents:read means callers with restricted default permissions
    # need no explicit grant.
    permissions:
      contents: read
    # Same-PR pushes cancel earlier in-flight reviews so only the latest commit
    # is reviewed. comment.id keeps each reply/command run in its own group —
    # without it, two quick replies cancel each other and the first is lost.
    concurrency:
      group: pavo-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event.comment.id || 'pr' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      # Org-level kill switch: set the PAVO_DISABLED variable to 'true' to stop
      # every Pavo run at the gate (e.g. while rolling back a bad change).
      PAVO_DISABLED: ${{ vars.PAVO_DISABLED || 'false' }}
    steps:
      # Pavo's scripts come from the commit this workflow was loaded from, so
      # the caller's one SHA pin decides everything that runs. Delegating to a
      # separate `uses: k35o/pavo@<sha>` action instead meant hard-coding that
      # SHA here (`uses:` takes no expressions), and a commit cannot name its
      # own SHA, so callers always ran the action one version behind.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .pavo
          persist-credentials: false

      # The PR checkout below empties the workspace.
      - run: mv .pavo "${RUNNER_TEMP}/pavo-src"

      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.K35O_BOT_CLIENT_ID }}
          private-key: ${{ secrets.K35O_BOT_PRIVATE_KEY }}

      # All trigger/config logic lives in gate.ts so it is unit-testable.
      # Repo-side .github/pavo.json (if any) is merged over the inputs here.
      - id: gate
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          SKIP_LABEL: ${{ inputs.skip_label }}
          INSTRUCTIONS: ${{ inputs.instructions }}
          EXTRA_PROMPT: ${{ inputs.extra_prompt }}
          MODEL: ${{ inputs.model }}
          LANGUAGE: ${{ inputs.language }}
          APPROVE: ${{ inputs.approve }}
          MIN_SEVERITY: ${{ inputs.min_severity }}
          IGNORE_PATHS: ${{ inputs.ignore_paths }}
          ALLOW_BOTS: ${{ inputs.allow_bots }}
          REVIEW_DRAFTS: ${{ inputs.review_drafts }}
          OUT_DIR: ${{ runner.temp }}/pavo
        run: |
          set -euo pipefail
          node "${RUNNER_TEMP}/pavo-src/scripts/gate.ts"

      # Fail fast with actionable errors before burning a Claude session:
      # a missing App installation otherwise surfaces as a 403 on the very
      # last POST, after the whole review has been generated.
      - id: bot
        if: steps.gate.outputs.mode != 'skip'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.gate.outputs.pr_number }}
        run: |
          set -euo pipefail
          name="${APP_SLUG}[bot]"
          if ! id=$(gh api "/users/${name}" --jq .id); then
            echo "::error::GitHub App user ${name} not found."
            exit 1
          fi
          if ! gh api "repos/${REPO}" --jq .id > /dev/null; then
            echo "::error::App token cannot read ${REPO}. GitHub App がこのリポジトリにインストールされているか確認してください。"
            exit 1
          fi
          if ! gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq .id > /dev/null; then
            echo "::error::App token cannot read PR #${PR_NUMBER}. App の Repository permissions（Pull requests: Read & write）を確認してください。"
            exit 1
          fi
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "id=${id}" >> "$GITHUB_OUTPUT"

      # The claude_args block is the security boundary for both Claude
      # invocations (read-only tools, .git/ deny, no PR-side settings), so it is
      # defined exactly once. MODEL comes from gate so the pavo:deep label
      # override applies. --setting-sources user: never load .claude/settings.json
      # (hooks) from the checked-out PR. Read/Grep are denied on .git/ because
      # claude-code-action configures git auth with the App token in .git/config.
      # The allowlist has no write or gh-api tools; posting is done by Pavo's
      # scripts.
      - id: claude-args
        if: steps.gate.outputs.mode != 'skip'
        env:
          MODE: ${{ steps.gate.outputs.mode }}
          MODEL: ${{ steps.gate.outputs.model }}
        run: |
          set -euo pipefail
          case "${MODE}" in
            review) max_turns=60 schema=review.json ;;
            convo) max_turns=30 schema=reply.json ;;
            *) echo "::error::unexpected mode ${MODE}"; exit 1 ;;
          esac
          delim="PAVO_ARGS_$(openssl rand -hex 16)"
          {
            echo "claude_args<<${delim}"
            echo "--model ${MODEL}"
            echo "--max-turns ${max_turns}"
            echo "--setting-sources user"
            echo "--allowedTools \"Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*)\""
            echo "--disallowedTools \"Read(./.git/**),Grep(./.git/**)\""
            echo "--json-schema '$(jq -c . "${RUNNER_TEMP}/pavo-src/scripts/schemas/${schema}")'"
            echo "${delim}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "verify_args<<${delim}"
            echo "--model ${MODEL}"
            echo "--max-turns 30"
            echo "--setting-sources user"
            echo "--allowedTools \"Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*)\""
            echo "--disallowedTools \"Read(./.git/**),Grep(./.git/**)\""
            echo "--json-schema '$(jq -c . "${RUNNER_TEMP}/pavo-src/scripts/schemas/verify.json")'"
            echo "${delim}"
          } >> "$GITHUB_OUTPUT"

      # The head commit (not the transient merge ref): what `gh pr diff` shows,
      # what Read sees, and what inline comment anchors refer to must all be the
      # same commit. persist-credentials:false keeps the checkout token out of
      # .git/config; claude-code-action still writes its own git auth there, so
      # the claude steps below additionally deny Read on .git/.
      - if: steps.gate.outputs.mode != 'skip'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.gate.outputs.head_sha }}
          fetch-depth: 1
          persist-credentials: false

      # ===== review path =====

      - id: context
        if: steps.gate.outputs.mode == 'review'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.gate.outputs.pr_number }}
          BOT_NAME: ${{ steps.bot.outputs.name }}
          HEAD_SHA: ${{ steps.gate.outputs.head_sha }}
          OUT_DIR: ${{ runner.temp }}/pavo
        run: |
          set -euo pipefail
          node "${RUNNER_TEMP}/pavo-src/scripts/collect-context.ts"

      - id: review-prompt
        if: steps.gate.outputs.mode == 'review'
        env:
          ACTION_PATH: ${{ runner.temp }}/pavo-src
          CONFIG: ${{ steps.gate.outputs.config }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.gate.outputs.pr_number }}
          PR_TITLE: ${{ steps.gate.outputs.pr_title }}
          PR_BODY: ${{ steps.gate.outputs.pr_body }}
          HEAD_SHA: ${{ steps.gate.outputs.head_sha }}
          CONTEXT_FILE: ${{ steps.context.outputs.context_file }}
          ON_DEMAND: ${{ steps.gate.outputs.on_demand }}
          REPO_CONTEXT_FILE: ${{ steps.gate.outputs.repo_context_file }}
          LEARNINGS_FILE: ${{ steps.gate.outputs.learnings_file }}
          CONVENTIONS_FILE: ${{ steps.gate.outputs.conventions_file }}
        run: |
          set -euo pipefail
          node "${RUNNER_TEMP}/pavo-src/scripts/build-review-prompt.ts"

      - id: claude-review
        if: steps.gate.outputs.mode == 'review'
        uses: anthropics/claude-code-action@e4a6faad497d33dbc7144135c75e41f82f0bf6c0 # v1.0.255
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app-token.outputs.token }}
          bot_id: ${{ steps.bot.outputs.id }}
          bot_name: ${{ steps.bot.outputs.name }}
          allowed_bots: ${{ inputs.allow_bots }}
          prompt: ${{ steps.review-prompt.outputs.prompt }}
          claude_args: ${{ steps.claude-args.outputs.claude_args }}

      # Under the pavo:deep label, a fresh session sees only the 🔴/🟡 findings
      # (not the reviewing session's reasoning) and tries to refute each one;
      # post-review.ts demotes the refuted findings. Clean reviews skip this.
      # continue-on-error: a broken verification pass must degrade to posting
      # the unverified review, never discard a review that is ready to post.
      - id: verify-prompt
        if: steps.gate.outputs.mode == 'review' && steps.gate.outputs.deep == 'true'
        continue-on-error: true
        env:
          STRUCTURED_OUTPUT: ${{ steps.claude-review.outputs.structured_output }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.gate.outputs.pr_number }}
        run: |
          set -euo pipefail
          node "${RUNNER_TEMP}/pavo-src/scripts/build-verify-prompt.ts"

      - id: claude-verify
        if: steps.gate.outputs.mode == 'review' && steps.gate.outputs.deep == 'true' && steps.verify-prompt.outputs.skip == 'false'
        continue-on-error: true
        uses: anthropics/claude-code-action@e4a6faad497d33dbc7144135c75e41f82f0bf6c0 # v1.0.255
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app-token.outputs.token }}
          bot_id: ${{ steps.bot.outputs.id }}
          bot_name: ${{ steps.bot.outputs.name }}
          allowed_bots: ${{ inputs.allow_bots }}
          prompt: ${{ steps.verify-prompt.outputs.prompt }}
          claude_args: ${{ steps.claude-args.outputs.verify_args }}

      - if: steps.gate.outputs.mode == 'review'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.gate.outputs.pr_number }}
          HEAD_SHA: ${{ steps.gate.outputs.head_sha }}
          BOT_NAME: ${{ steps.bot.outputs.name }}
          CONFIG: ${{ steps.gate.outputs.config }}
          STRUCTURED_OUTPUT: ${{ steps.claude-review.outputs.structured_output }}
          CONTEXT_FILE: ${{ steps.context.outputs.context_file }}
          VERIFY_OUTPUT: ${{ steps.claude-verify.outputs.structured_output }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PAVO_REF: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          node "${RUNNER_TEMP}/pavo-src/scripts/post-review.ts"

      # ===== conversation path =====

      - id: convo-prompt
        if: steps.gate.outputs.mode == 'convo'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ACTION_PATH: ${{ runner.temp }}/pavo-src
          CONFIG: ${{ steps.gate.outputs.config }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.gate.outputs.pr_number }}
          PR_TITLE: ${{ steps.gate.outputs.pr_title }}
          PR_BODY: ${{ steps.gate.outputs.pr_body }}
          ROOT_ID: ${{ steps.gate.outputs.root_id }}
          BOT_NAME: ${{ steps.bot.outputs.name }}
          REPO_CONTEXT_FILE: ${{ steps.gate.outputs.repo_context_file }}
        run: |
          set -euo pipefail
          node "${RUNNER_TEMP}/pavo-src/scripts/build-conversation-prompt.ts"

      - id: claude-convo
        if: steps.gate.outputs.mode == 'convo' && steps.convo-prompt.outputs.skip == 'false'
        uses: anthropics/claude-code-action@e4a6faad497d33dbc7144135c75e41f82f0bf6c0 # v1.0.255
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app-token.outputs.token }}
          bot_id: ${{ steps.bot.outputs.id }}
          bot_name: ${{ steps.bot.outputs.name }}
          allowed_bots: ${{ inputs.allow_bots }}
          prompt: ${{ steps.convo-prompt.outputs.prompt }}
          claude_args: ${{ steps.claude-args.outputs.claude_args }}

      - if: steps.gate.outputs.mode == 'convo' && steps.convo-prompt.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.gate.outputs.pr_number }}
          ROOT_ID: ${{ steps.gate.outputs.root_id }}
          BOT_NAME: ${{ steps.bot.outputs.name }}
          STRUCTURED_OUTPUT: ${{ steps.claude-convo.outputs.structured_output }}
        run: |
          set -euo pipefail
          node "${RUNNER_TEMP}/pavo-src/scripts/post-reply.ts"

      # ===== failure notification =====

      # The claude step log sanitizes result messages down to counters, so e.g.
      # a revoked OAuth token surfaces only as total_cost_usd: 0. The real error
      # text survives in claude-execution-output.json on the runner — extract it
      # into ::error:: and the step summary. The script never exits non-zero.
      - if: failure() && (steps.claude-review.outcome == 'failure' || steps.claude-convo.outcome == 'failure')
        env:
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file || steps.claude-convo.outputs.execution_file }}
        run: |
          set -euo pipefail
          node "${RUNNER_TEMP}/pavo-src/scripts/diagnose-claude-failure.ts"

      # A red Actions badge is easy to miss in solo operation; leave a trace on
      # the PR itself. `|| true` — never mask the original failure. The event
      # payload fallback covers gate crashing before it could emit pr_number
      # (e.g. invalid .github/pavo.json).
      - if: failure() && steps.gate.outputs.mode != 'skip' && (steps.gate.outputs.pr_number || github.event.pull_request.number || github.event.issue.number)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.gate.outputs.pr_number || github.event.pull_request.number || github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          jq -n --arg body "⚠️ Pavo の実行が失敗しました: ${RUN_URL}" '{body: $body}' \
            | gh api --method POST "repos/${REPO}/issues/${PR_NUMBER}/comments" --input - || true
